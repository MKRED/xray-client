name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Версия Xray-core для Android (релизы 2dust/AndroidLibXrayLite)
  LIBXRAY_TAG: v26.10.31

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Download Xray core (libv2ray.aar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download "$LIBXRAY_TAG" -R 2dust/AndroidLibXrayLite -p libv2ray.aar -D app/libs
          ls -la app/libs

      - name: Russian routing rules (assets)
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o "$RUNNER_TEMP/geoip.dat" https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat
          curl -fsSL -o "$RUNNER_TEMP/geosite.dat" https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat
          python3 scripts/trim_geo.py "$RUNNER_TEMP/geoip.dat" app/src/main/assets/ru-geoip.dat RU PRIVATE
          python3 scripts/trim_geo.py "$RUNNER_TEMP/geosite.dat" app/src/main/assets/ru-geosite.dat CATEGORY-RU TLD-RU RU-AVAILABLE-ONLY-INSIDE RU-BLOCKED PRIVATE

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK подписан временным debug-ключом, обновления поверх него не встанут"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          UPDATE_REPO: ${{ github.repository }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk xray-client.apk

      - uses: actions/upload-artifact@v7
        with:
          name: xray-client-${{ github.run_number }}
          path: xray-client.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          NOTES="$(git log -1 --pretty=%B)"
          gh release create "$TAG" xray-client.apk --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA"
