name: Update routing rules

# Раз в сутки собирает свежие урезанные базы для обхода российских сайтов
# и выкладывает их в пре-релиз «rules» — оттуда их скачивает приложение.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download and trim
        run: |
          curl -fsSL -o "$RUNNER_TEMP/geoip.dat" https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat
          curl -fsSL -o "$RUNNER_TEMP/geosite.dat" https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat
          python3 scripts/trim_geo.py "$RUNNER_TEMP/geoip.dat" ru-geoip.dat RU PRIVATE
          python3 scripts/trim_geo.py "$RUNNER_TEMP/geosite.dat" ru-geosite.dat CATEGORY-RU TLD-RU RU-AVAILABLE-ONLY-INSIDE RU-BLOCKED PRIVATE

      - name: Publish to «rules» pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Пре-релиз, чтобы он никогда не стал «последним релизом» — по нему приложение ищет обновления
          gh release view rules >/dev/null 2>&1 || \
            gh release create rules --prerelease --title "Базы маршрутизации" \
              --notes "Урезанные geoip/geosite (runetfreedom) для обхода российских сайтов. Обновляются автоматически."
          gh release upload rules ru-geoip.dat ru-geosite.dat --clobber
